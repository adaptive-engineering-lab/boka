# Netlify deployment (T093).
#
# See quickstart.md "Deploying to Netlify" for the environment variables this build needs.
# Two of them are not optional in the way they look:
#
#   SUPABASE_SERVICE_ROLE_KEY  bypasses RLS entirely and must never be prefixed NEXT_PUBLIC_.
#   RATE_LIMIT_SALT            without it, submission rate limiting is effectively disabled on
#                              serverless — see lib/inquiries/rate-limit.ts.

[build]
  # `verify:heic` runs FIRST and exits non-zero if this platform's sharp cannot decode HEIC.
  #
  # That turns T009's permanently-unverified half into a standing guarantee. FR-007 requires
  # accepting HEIC because the designer uploads from an iPhone, and whether sharp can decode it
  # depends on how libvips was built on the deploy target — research D5 named this the
  # assumption in the plan most likely to be wrong. Checking it here means the failure is a red
  # build with a clear message, rather than a designer discovering on a Sunday that half her
  # photographs are rejected.
  command = "npm run verify:heic && npm run build"
  publish = ".next"

[build.environment]
  # package.json requires >= 20.
  NODE_VERSION = "20"

  # Netlify's secrets scanner found the Supabase publishable key and project URL in the client
  # bundle (and, for the URL, in the compiled edge middleware). Both are supposed to be there:
  # the key is subject to RLS and the URL is just the project's public endpoint — exactly what
  # every visitor's browser holds. Both key names are listed because lib/supabase/env.ts takes
  # either.
  #
  # **Omitted by key, and scanning stays ON.** `SECRETS_SCAN_ENABLED = "false"` and broad
  # `SECRETS_SCAN_OMIT_PATHS` would also make the build pass, and either would be a bad trade.
  # The one secret that must never reach a bundle is SUPABASE_SERVICE_ROLE_KEY — it bypasses RLS
  # completely, which is where every privacy guarantee in this project lives. This scanner is a
  # second, independent check on that, of the same kind as
  # `tests/integration/no-service-key.test.ts`, and it runs against the real deployed artifact
  # rather than a local build. Naming the deliberately-public values keeps that protection intact;
  # switching the scanner off to clear a warning would discard it.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL"

[[plugins]]
  # Netlify installs this automatically; declaring it keeps the build reproducible.
  package = "@netlify/plugin-nextjs"
